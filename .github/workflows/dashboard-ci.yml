name: Dashboard CI

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-*.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/pipeline/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r dashboard/pipeline/requirements.txt
      - name: Pipeline rule tests
        working-directory: dashboard/pipeline
        run: python -m unittest discover -s tests
      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - name: Install web dependencies
        working-directory: dashboard/web
        run: npm ci
      - name: Web tests
        working-directory: dashboard/web
        run: npm test
      - name: Web build
        working-directory: dashboard/web
        run: npm run build
